<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dev Studio AI | Founder Console</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        :root {
            --bg-dark: #050811;
            --panel-bg: #0f172a;
            --card-bg: #1e293b;
            --accent-green: #10b981;
            --accent-gold: #f59e0b;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }
        body { background: var(--bg-dark); color: var(--text-main); font-family: 'Inter', sans-serif; display: flex; height: 100vh; margin: 0; }
        .sidebar { width: 360px; background: var(--panel-bg); border-right: 1px solid var(--border-color); padding: 20px; overflow-y: auto; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #0b1120; }
        
        /* ✅ Admin Header */
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
        }
        
        .admin-header h2 {
            margin: 0;
            color: var(--accent-gold);
            font-size: 18px;
        }
        
        /* ✅ Clear History Button */
        .clear-history-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 12px;
        }
        
        .clear-history-btn:hover {
            background: #b91c1c;
            transform: scale(1.05);
        }
        
        .client-card { padding: 14px; background: var(--card-bg); border-radius: 10px; margin-bottom: 12px; cursor: pointer; border: 1.5px solid var(--border-color); transition: 0.2s; }
        .client-card.active { border-color: var(--accent-green); background: rgba(16, 185, 129, 0.12); }
        .client-card h4 { margin: 0 0 4px 0; color: var(--accent-gold); font-size: 15px; }
        .client-card p { margin: 2px 0; font-size: 12px; color: var(--text-secondary); }
        
        .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 8px; max-width: 70%; font-size: 14px; line-height: 1.4; }
        .user-msg { background: #1e3a8a; border: 1px solid #3b82f6; align-self: flex-start; }
        .admin-msg { background: #065f46; border: 1px solid var(--accent-green); align-self: flex-end; }
        
        .input-bar { padding: 16px; background: var(--panel-bg); display: flex; gap: 10px; border-top: 1px solid var(--border-color); }
        .input-bar input { flex: 1; padding: 12px; background: #050811; border: 1px solid var(--border-color); color: white; border-radius: 8px; }
        .input-bar input:focus { outline: none; border-color: var(--accent-green); }
        .input-bar button { background: var(--accent-green); border: none; color: #000; font-weight: 700; padding: 12px 20px; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; }
        .input-bar button:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(16, 185, 129, 0.3); }
        
        /* ✅ Responsive */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border-color); max-height: 40vh; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="admin-header">
            <h2>👑 Verified Client Inbox</h2>
        </div>
        <div id="clientList"></div>
    </div>
    <div class="chat-area">
        <div class="admin-header">
            <h3 style="margin: 0; color: var(--accent-green);" id="clientHeader">Select a client to view full history</h3>
            <!-- ✅ CLEAR HISTORY BUTTON -->
            <button class="clear-history-btn" onclick="clearAllHistory()">🗑️ Clear All History</button>
        </div>
        <div class="messages" id="msgBox"></div>
        <div class="input-bar">
            <input type="text" id="adminInput" placeholder="Type reply and press Enter..." onkeydown="handleAdminEnter(event)">
            <button onclick="sendReply()">Send Reply ⚡</button>
        </div>
    </div>

    <script>
        const socket = io();
        let selectedUser = null;
        let allLeads = {}, allHistories = {};

        socket.emit('register_lead', { user_id: 'admin_console', lead_info: {} });

        socket.on('update_admin_leads', (data) => {
            allLeads = data.leads;
            allHistories = data.histories;
            renderClientList();
        });

        function renderClientList() {
            const list = document.getElementById('clientList');
            list.innerHTML = '';
            Object.keys(allLeads).forEach(uid => {
                const lead = allLeads[uid];
                const div = document.createElement('div');
                div.className = `client-card ${selectedUser === uid ? 'active' : ''}`;
                div.innerHTML = `
                    <h4>${lead.name} (${lead.role}) ✅</h4>
                    <p>📧 ${lead.email} | 📞 ${lead.phone}</p>
                    <p>🌍 ${lead.country} | 👤 Age: ${lead.age}</p>
                `;
                div.onclick = () => selectClient(uid);
                list.appendChild(div);
            });
        }

        function selectClient(uid) {
            selectedUser = uid;
            renderClientList();
            const lead = allLeads[uid];
            document.getElementById('clientHeader').innerHTML = `
                <h3 style="margin:0; color:#10b981;">Chatting with: ${lead.name} (${lead.email})</h3>
                <p style="font-size: 12px; color: #94a3b8; margin: 4px 0 0 0;">Phone: ${lead.phone} | Country: ${lead.country}</p>
            `;
            socket.emit('join_owner_chat', { user_id: uid });
        }

        socket.on('load_history', (data) => {
            const box = document.getElementById('msgBox');
            box.innerHTML = '';
            data.history.forEach(m => appendMsg(m.sender === 'admin' ? 'admin-msg' : 'user-msg', m.message));
        });

        function sendReply() {
            const input = document.getElementById('adminInput');
            if (!input.value || !selectedUser) return;
            socket.emit('send_owner_message', { user_id: selectedUser, sender: 'admin', message: input.value });
            input.value = '';
        }

        function handleAdminEnter(e) { if (e.key === 'Enter') sendReply(); }

        socket.on('admin_receive_message', (data) => {
            if (data.user_id === selectedUser) {
                appendMsg(data.sender === 'admin' ? 'admin-msg' : 'user-msg', data.message);
            }
        });

        function appendMsg(cls, txt) {
            const box = document.getElementById('msgBox');
            const div = document.createElement('div');
            div.className = `msg ${cls}`;
            div.innerText = txt;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        // ✅ CLEAR ALL HISTORY FUNCTION
        function clearAllHistory() {
            if (confirm('Are you sure you want to clear all history? This cannot be undone!')) {
                socket.emit('clear_all_history');
                document.getElementById('msgBox').innerHTML = '';
                alert('✅ All history cleared!');
            }
        }

        // ✅ Listen for clear history response
        socket.on('history_cleared', () => {
            document.getElementById('msgBox').innerHTML = '';
        });
    </script>
</body>
</html>
